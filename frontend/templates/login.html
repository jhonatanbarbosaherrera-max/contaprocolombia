
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ContaPro Colombia</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151515;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #242424;
            padding: 35px;
            border-radius: 12px;
            color: white;
        }

        h1 {
            color: #e63946;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #333;
            color: white;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #e63946;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c92535;
        }

        .footer {
            text-align: center;
            color: #888;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>ContaPro</h1>
        <p class="subtitle">COLOMBIA · Gestión empresarial</p>

        <form action="/login" method="POST">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="correo@ejemplo.com"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                required
            >

            <button type="submit">INICIAR SESIÓN</button>
        </form>

        <p class="footer">
            ContaPro Colombia © 2026
        </p>
    </main>
</body>
</html>
